<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click That Butt - v2.0 SI Edition</title>
<style>
  /* ============================================================
     CLICK THAT BUTT - v1.0
     A Visual Basic 1.0-themed reaction game
     ============================================================ */

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #008080;             /* Win 3.1 desktop teal */
    font-family: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Geneva, sans-serif;
    font-size: 11px;
    color: #000;
    user-select: none;
    -webkit-font-smoothing: none;     /* keep fonts crispy/jaggy */
    image-rendering: pixelated;
  }

  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
    overflow: auto;
  }

  /* ---------- Window chrome ---------- */
  .window {
    width: 720px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    box-shadow: 1px 1px 0 #000;
    position: relative;
  }
  .window-inner {
    border: 2px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
  }

  .titlebar {
    background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
    color: #ffffff;
    padding: 2px 2px 2px 4px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0;
  }
  .titlebar.inactive {
    background: linear-gradient(90deg, #808080 0%, #b5b5b5 100%);
  }
  .titlebar-text {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 1px 0;
  }
  .titlebar-icon {
    width: 16px;
    height: 14px;
    background: #c0c0c0;
    border: 1px solid #000;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #000;
    font-weight: normal;
  }
  .titlebar-buttons { display: flex; gap: 2px; }
  .tb-btn {
    width: 16px;
    height: 14px;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    color: #000;
    font-size: 9px;
    font-family: "Marlett", "MS Sans Serif", monospace;
    text-align: center;
    line-height: 12px;
    cursor: default;
    padding: 0;
    font-weight: bold;
  }
  .tb-btn:active {
    border-color: #000000 #ffffff #ffffff #000000;
  }

  /* ---------- Menu bar ---------- */
  .menubar {
    display: flex;
    padding: 1px 2px;
    border-bottom: 1px solid #808080;
    background: #c0c0c0;
  }
  .menubar > div {
    padding: 2px 8px 3px;
    cursor: default;
  }
  .menubar > div:hover {
    background: #000080;
    color: #ffffff;
  }
  .menubar u { text-decoration: underline; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    padding: 6px 8px;
    display: flex;
    gap: 8px;
    align-items: center;
    border-bottom: 1px solid #808080;
    background: #c0c0c0;
  }

  /* ---------- VB-style buttons ---------- */
  button.vb {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
    padding: 3px 12px 3px 12px;
    font-family: inherit;
    font-size: 11px;
    color: #000;
    cursor: default;
    min-width: 75px;
    font-weight: normal;
  }
  button.vb:focus {
    outline: 1px dotted #000;
    outline-offset: -4px;
  }
  button.vb:active:not(:disabled),
  button.vb.pressed {
    border-color: #000000 #ffffff #ffffff #000000;
    box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #dfdfdf;
    padding: 4px 11px 2px 13px;
  }
  button.vb:disabled { color: #808080; text-shadow: 1px 1px 0 #ffffff; }

  select.vb {
    background: #ffffff;
    border: 2px solid;
    border-color: #808080 #ffffff #ffffff #808080;
    box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 #dfdfdf;
    font-family: inherit;
    font-size: 11px;
    padding: 1px 2px;
    color: #000;
  }

  label.fld {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* ---------- Play area (sunken white panel) ---------- */
  .playwrap {
    padding: 8px;
    background: #c0c0c0;
  }
  .playarea {
    background: #ffffff;
    border: 2px solid;
    border-color: #808080 #ffffff #ffffff #808080;
    box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 #dfdfdf;
    height: 420px;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
    background-image:
      linear-gradient(0deg, transparent 24%, rgba(0,0,0,0.02) 25%, rgba(0,0,0,0.02) 26%, transparent 27%),
      linear-gradient(90deg, transparent 24%, rgba(0,0,0,0.02) 25%, rgba(0,0,0,0.02) 26%, transparent 27%);
    background-size: 32px 32px;
  }

  /* ---------- The target ---------- */
  .target {
    position: absolute;
    left: 0; top: 0;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080, 1px 1px 0 #404040;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    color: #000;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1;
    white-space: nowrap;
  }
  .target:active {
    border-color: #000000 #ffffff #ffffff #000000;
  }
  .target .lbl {
    font-size: 10px;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* ---------- The Booty (photo targets) ---------- */
  .target {
    padding: 4px;
  }
  .booty-img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid #808080;
    display: block;
    animation: booty-bounce 1.2s ease-in-out infinite;
    transform-origin: 50% 90%;
  }
  @keyframes booty-bounce {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25%      { transform: scale(1.03) rotate(-1.5deg); }
    50%      { transform: scale(0.97) rotate(0deg); }
    75%      { transform: scale(1.03) rotate(1.5deg); }
  }
  .target.shake .booty-img { animation: shake 0.18s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    25%      { transform: translateX(-3px) rotate(-5deg); }
    75%      { transform: translateX( 3px) rotate( 5deg); }
  }

  /* ---------- Status bar ---------- */
  .statusbar {
    display: flex;
    padding: 2px 2px 3px;
    gap: 2px;
    background: #c0c0c0;
    border-top: 1px solid #ffffff;
  }
  .sb-cell {
    border: 1px solid;
    border-color: #808080 #ffffff #ffffff #808080;
    padding: 2px 6px 3px;
    background: #c0c0c0;
  }
  .sb-cell:first-child { flex: 2; }
  .sb-cell:not(:first-child) { min-width: 80px; }

  /* ---------- Dialogs ---------- */
  .dialog-mask {
    position: fixed; inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dialog {
    pointer-events: auto;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    box-shadow: 2px 2px 0 #000, inset 1px 1px 0 #dfdfdf;
    min-width: 320px;
    max-width: 420px;
    font-size: 11px;
  }
  .dialog .titlebar { font-size: 11px; }
  .dialog-body {
    padding: 16px 16px 12px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .dialog-icon {
    width: 32px; height: 32px;
    border: 1px solid #000;
    background: #ffffcc;
    color: #000080;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold;
    font-family: "Times New Roman", serif;
    flex-shrink: 0;
  }
  .dialog-icon.info  { background: #ffffff; color: #000080; }
  .dialog-icon.warn  { background: #ffff00; color: #000;    }
  .dialog-icon.party { background: #ff00ff; color: #ffff00; }
  .dialog-text { line-height: 1.5; flex: 1; }
  .dialog-text h3 { margin: 0 0 6px; font-size: 12px; }
  .dialog-buttons {
    padding: 0 16px 14px;
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .dialog-buttons button.vb { min-width: 75px; }

  /* ---------- Splash banner inside playarea ---------- */
  .splash {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    color: #000080;
    text-align: center;
  }
  .splash h1 {
    font-family: "Times New Roman", Times, serif;
    font-size: 38px;
    margin: 0 0 6px;
    color: #000080;
    text-shadow: 2px 2px 0 #c0c0c0, 3px 3px 0 #808080;
    letter-spacing: 1px;
  }
  .splash .sub { color: #000; font-size: 12px; }
  .splash .blink { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  /* ---------- Floating score popups ---------- */
  .pop {
    position: absolute;
    color: #008000;
    font-weight: bold;
    font-size: 14px;
    pointer-events: none;
    animation: float 700ms ease-out forwards;
    text-shadow: 1px 1px 0 #fff;
  }
  .pop.miss { color: #c00000; }
  @keyframes float {
    0%   { transform: translateY(0)    scale(1);   opacity: 1; }
    100% { transform: translateY(-30px) scale(1.1); opacity: 0; }
  }
</style>
</head>
<body>

<div class="window" role="application" aria-label="Click That Butt">
  <div class="window-inner">

    <div class="titlebar" id="titlebar">
      <div class="titlebar-text">
        <span class="titlebar-icon">🔥</span>
        <span>Click That Butt - [SI Edition]</span>
      </div>
      <div class="titlebar-buttons">
        <button class="tb-btn" title="Minimize">_</button>
        <button class="tb-btn" title="Maximize">▢</button>
        <button class="tb-btn" title="Close" id="closeBtn">×</button>
      </div>
    </div>

    <div class="menubar">
      <div data-menu="file"><u>F</u>ile</div>
      <div data-menu="game"><u>G</u>ame</div>
      <div data-menu="opts"><u>O</u>ptions</div>
      <div data-menu="help"><u>H</u>elp</div>
    </div>

    <div class="toolbar">
      <button class="vb" id="startBtn"><u>S</u>tart!</button>
      <button class="vb" id="stopBtn" disabled>St<u>o</u>p</button>
      <span style="margin-left:6px">|</span>
      <label class="fld">Difficulty:
        <select class="vb" id="difficulty">
          <option value="easy">Easy &mdash; Sitting Duck</option>
          <option value="medium" selected>Medium &mdash; Slippery</option>
          <option value="hard">Hard &mdash; Greased</option>
          <option value="impossible">IMPOSSIBLE</option>
        </select>
      </label>
      <label class="fld">Time:
        <select class="vb" id="duration">
          <option value="15">0:15</option>
          <option value="30" selected>0:30</option>
          <option value="60">1:00</option>
          <option value="-1">∞ Endless</option>
        </select>
      </label>
      <button class="vb" id="aboutBtn" style="margin-left:auto"><u>A</u>bout...</button>
    </div>

    <div class="playwrap">
      <div class="playarea" id="playarea">
        <div class="splash" id="splash">
          <h1>CLICK THAT BOOTY!</h1>
          <div class="sub">Press <b>Start!</b> to begin.</div>
          <div class="sub blink" style="margin-top:14px">▓ Ready ▓</div>
        </div>
      </div>
    </div>

    <div class="statusbar">
      <div class="sb-cell" id="status">Ready.</div>
      <div class="sb-cell">Hits: <b id="score">0</b></div>
      <div class="sb-cell">Misses: <b id="misses">0</b></div>
      <div class="sb-cell">Time: <b id="time">0:30</b></div>
      <div class="sb-cell">Best: <b id="best">0</b></div>
    </div>

  </div>
</div>

<!-- Dialog template root -->
<div class="dialog-mask" id="dlgMask" style="display:none"></div>

  let target = null;
  let score = 0, misses = 0, best = 0;
  let timeLeft = 30;
  let totalTime = 30;
  let endless = false;
  let gameOn = false;
  let timerInt = null;
  let mouseX = 0, mouseY = 0;
  let lastDodge = 0;

  // --- Web Audio: PC speaker style beeps ---
  let actx = null;
  function ensureAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { actx = null; }
    }
  }
  function beep(freq, dur = 0.05, type = 'square', vol = 0.08) {
    ensureAudio();
    if (!actx) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    const now = actx.currentTime;
    o.start(now);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.stop(now + dur + 0.02);
  }
  const sfx = {
    hit:   () => { beep(880, 0.04); setTimeout(() => beep(1320, 0.05), 35); },
    miss:  () => { beep(180, 0.10, 'sawtooth', 0.10); },
    dodge: () => { beep(660, 0.02, 'square', 0.04); },
    start: () => { [523, 659, 784, 1047].forEach((f,i) => setTimeout(() => beep(f, 0.08), i*80)); },
    end:   () => { [523, 392, 330, 262].forEach((f,i) => setTimeout(() => beep(f, 0.12, 'triangle'), i*120)); },
    win:   () => { [523, 659, 784, 1047, 1319].forEach((f,i) => setTimeout(() => beep(f, 0.10), i*70)); },
    click: () => { beep(2000, 0.005, 'square', 0.04); },
  };

  // --- Target ---
  function spawnTarget() {
    if (target) target.remove();
    target = document.createElement('button');
    target.className = 'target';
    target.type = 'button';
    const diff = SETTINGS[difficulty.value];
    const imgSrc = BOOTY_IMGS[Math.floor(Math.random() * BOOTY_IMGS.length)];
    target.innerHTML = `
      <img class="booty-img" src="${imgSrc}" alt="Booty!" draggable="false" />
      <span class="lbl">${diff.label}</span>`;
    target.addEventListener('click', onTargetClick);
    target.addEventListener('mousedown', e => e.stopPropagation());
    playarea.appendChild(target);
    moveTarget(true);
  }

  function moveTarget(initial = false) {
    if (!target) return;
    const rect = playarea.getBoundingClientRect();
    const tw = target.offsetWidth  || 100;
    const th = target.offsetHeight || 50;
    const margin = 6;
    let x, y, tries = 0;
    do {
      x = Math.random() * (rect.width  - tw - margin * 2) + margin;
      y = Math.random() * (rect.height - th - margin * 2) + margin;
      tries++;
      // Try to stay reasonably far from cursor
      const dx = (x + tw/2) - mouseX;
      const dy = (y + th/2) - mouseY;
      if (initial || Math.hypot(dx, dy) > 120 || tries > 8) break;
    } while (true);
    target.style.left = x + 'px';
    target.style.top  = y + 'px';
  }

  function onTargetClick(e) {
    e.stopPropagation();
    if (!gameOn) return;
    score++;
    scoreEl.textContent = score;
    sfx.hit();
    popText('+1', e.clientX, e.clientY, false);
    statusEl.textContent = randomPraise();
    moveTarget();
  }

  function randomPraise() {
    const p = ['SMASH!', 'Dat azz!', 'CLAPPED!', 'Peach perfect!', 'Thicc hit!', 'Bootylicious!', 'JUICY!', 'Slamdunk!', 'Home run!'];
    return p[Math.floor(Math.random() * p.length)];
  }

  function popText(txt, clientX, clientY, miss) {
    const rect = playarea.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'pop' + (miss ? ' miss' : '');
    el.textContent = txt;
    el.style.left = (clientX - rect.left) + 'px';
    el.style.top  = (clientY - rect.top)  + 'px';
    playarea.appendChild(el);
    setTimeout(() => el.remove(), 750);
  }

  // --- Misses (clicking the white area) ---
  playarea.addEventListener('click', e => {
    if (!gameOn) return;
    if (e.target === target || target?.contains(e.target)) return;
    misses++;
    missesEl.textContent = misses;
    sfx.miss();
    statusEl.textContent = TAUNTS[Math.floor(Math.random() * TAUNTS.length)];
    popText('MISS', e.clientX, e.clientY, true);
  });

  // --- Dodge logic on mousemove ---
  playarea.addEventListener('mousemove', e => {
    const rect = playarea.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    if (!gameOn || !target) return;

    const tx = parseFloat(target.style.left) + target.offsetWidth  / 2;
    const ty = parseFloat(target.style.top)  + target.offsetHeight / 2;
    const dist = Math.hypot(mouseX - tx, mouseY - ty);
    const diff = SETTINGS[difficulty.value];

    const now = performance.now();
    if (diff.radius > 0 && dist < diff.radius && (now - lastDodge) > 60) {
      if (Math.random() < diff.dodge) {
        // Pre-dodge shake for telegraph
        target.classList.add('shake');
        setTimeout(() => {
          if (target) target.classList.remove('shake');
        }, 180);
        moveTarget();
        sfx.dodge();
        lastDodge = now;
      }
    }
  });

  // --- Game flow ---
  function fmtTime(s) {
    if (s < 0) return '∞';
    const m = Math.floor(s / 60);
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function startGame() {
    if (gameOn) return;
    score = 0; misses = 0;
    totalTime = parseInt(duration.value, 10);
    endless = totalTime < 0;
    timeLeft = endless ? 0 : totalTime;
    scoreEl.textContent = '0';
    missesEl.textContent = '0';
    timeEl.textContent = endless ? '∞' : fmtTime(timeLeft);
    splash.style.display = 'none';
    gameOn = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    sfx.start();
    statusEl.textContent = SETTINGS[difficulty.value].taunt;
    spawnTarget();

    timerInt = setInterval(() => {
      if (endless) {
        timeLeft++;
        timeEl.textContent = fmtTime(timeLeft);
      } else {
        timeLeft--;
        timeEl.textContent = fmtTime(timeLeft);
        if (timeLeft <= 0) endGame();
      }
    }, 1000);
  }

  function stopGame(silent = false) {
    if (!gameOn && !silent) return;
    clearInterval(timerInt);
    timerInt = null;
    gameOn = false;
    startBtn.disabled = false;
    stopBtn.disabled  = true;
    if (target) { target.remove(); target = null; }
    splash.style.display = 'flex';
  }

  function endGame() {
    const finalScore = score;
    const finalMiss  = misses;
    const accuracy = (score + misses) > 0
      ? Math.round((score / (score + misses)) * 100)
      : 0;
    stopGame(true);
    const newBest = finalScore > best;
    if (newBest) {
      best = finalScore;
      bestEl.textContent = best;
      sfx.win();
    } else {
      sfx.end();
    }
    statusEl.textContent = newBest
      ? `★ NEW HIGH SCORE: ${finalScore} ★`
      : `Game over. Final: ${finalScore}`;
    showGameOver(finalScore, finalMiss, accuracy, newBest);
  }

  // --- Dialogs ---
  function showDialog({ title, icon = 'info', html, buttons }) {
    sfx.click();
    dlgMask.innerHTML = '';
    dlgMask.style.display = 'flex';
    titlebar.classList.add('inactive');

    const dlg = document.createElement('div');
    dlg.className = 'dialog';
    dlg.innerHTML = `
      <div class="titlebar">
        <div class="titlebar-text"><span>${title}</span></div>
        <div class="titlebar-buttons">
          <button class="tb-btn" data-close>×</button>
        </div>
      </div>
      <div class="dialog-body">
        <div class="dialog-icon ${icon}">${
          icon === 'info'  ? 'i' :
          icon === 'warn'  ? '!' :
          icon === 'party' ? '★' : '?'
        }</div>
        <div class="dialog-text">${html}</div>
      </div>
      <div class="dialog-buttons"></div>
    `;
    const btnRow = dlg.querySelector('.dialog-buttons');
    buttons.forEach((b, i) => {
      const el = document.createElement('button');
      el.className = 'vb';
      el.textContent = b.label;
      if (i === 0) setTimeout(() => el.focus(), 0);
      el.addEventListener('click', () => {
        closeDialog();
        if (b.onClick) b.onClick();
      });
      btnRow.appendChild(el);
    });
    dlg.querySelector('[data-close]').addEventListener('click', closeDialog);
    dlgMask.appendChild(dlg);
  }
  function closeDialog() {
    dlgMask.style.display = 'none';
    dlgMask.innerHTML = '';
    titlebar.classList.remove('inactive');
    sfx.click();
  }

  function showGameOver(s, m, acc, best) {
    const rating =
      s >= 50 ? 'BOOTY LORD'    :
      s >= 30 ? 'Azz Connoisseur' :
      s >= 15 ? 'Not bad'        :
      s >=  5 ? 'Marginal'       :
                'Need practice';
    showDialog({
      title: best ? '🏆 New High Score!' : 'Game Over',
      icon: best ? 'party' : 'info',
      html: `
        <h3>${best ? 'A WINNER IS YOU!' : 'Time\'s up.'}</h3>
        <table style="border-collapse:collapse;font-size:11px">
          <tr><td>Hits:</td><td><b>${s}</b></td></tr>
          <tr><td>Misses:</td><td><b>${m}</b></td></tr>
          <tr><td>Accuracy:</td><td><b>${acc}%</b></td></tr>
          <tr><td>Rating:</td><td><b>${rating}</b></td></tr>
          <tr><td style="padding-top:6px">Difficulty:</td><td style="padding-top:6px"><b>${difficulty.options[difficulty.selectedIndex].text}</b></td></tr>
        </table>`,
      buttons: [
        { label: 'Play Again', onClick: () => startGame() },
        { label: 'OK' }
      ]
    });
  }

  function showAbout() {
    showDialog({
      title: 'About Click That Butt',
      icon: 'info',
      html: `
        <h3>Click That Butt&trade;</h3>
        <div>Version 2.0.0.SI - Swimsuit Edition</div>
        <div style="margin-top:8px">Copyright &copy; 1991 Monumental Systems.<br>All rights reserved.</div>
        <div style="margin-top:10px;font-style:italic">A reaction game for the discerning rodent operator.</div>
        <div style="margin-top:10px;border-top:1px solid #808080;padding-top:8px">
          Memory: 640K OK<br>
          Math coprocessor: Not present<br>
          Mouse: Microsoft compatible
        </div>`,
      buttons: [{ label: 'OK' }]
    });
  }

  function showFarewell() {
    showDialog({
      title: 'Click That Butt',
      icon: 'warn',
      html: `<h3>It is now safe to turn off your computer.</h3>
             <div>Just kidding. Close the tab.</div>`,
      buttons: [{ label: 'OK' }]
    });
  }

  // --- Wiring ---
  startBtn.addEventListener('click', () => { sfx.click(); startGame(); });
  stopBtn .addEventListener('click', () => { sfx.click(); stopGame();  });
  aboutBtn.addEventListener('click', showAbout);


  closeBtn.addEventListener('click', showFarewell);

  difficulty.addEventListener('change', () => {
    sfx.click();
    if (gameOn && target) {
      const diff = SETTINGS[difficulty.value];
      target.querySelector('.lbl').textContent = diff.label;
      statusEl.textContent = diff.taunt;
    }
  });
  duration.addEventListener('change', () => sfx.click());

  // Menu items: cute no-ops with fake messages
  document.querySelectorAll('.menubar > div').forEach(m => {
    m.addEventListener('click', () => {
      const which = m.getAttribute('data-menu');
      sfx.click();
      if (which === 'help') showAbout();
      else if (which === 'game') startGame();
      else if (which === 'file') showFarewell();
      else statusEl.textContent = 'Menu not implemented in trial version.';
    });
  });

  // Keyboard: Space/Enter to start, Esc to stop
  document.addEventListener('keydown', e => {
    if (dlgMask.style.display !== 'none') {
      if (e.key === 'Escape' || e.key === 'Enter') {
        e.preventDefault();
        const btn = dlgMask.querySelector('button.vb');
        if (btn) btn.click();
      }
      return;
    }
    if (e.key === ' ' || e.key === 'Enter') {
      if (!gameOn) { e.preventDefault(); startGame(); }
    } else if (e.key === 'Escape') {
      if (gameOn) stopGame();
    }
  });

  // Initial UI state
  timeEl.textContent = fmtTime(parseInt(duration.value, 10));
})();
</script>

</body>
